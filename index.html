      test: /^Enspelled Armor\b/i
    },
    {
      key: 'enspelled-weapon',
      label: '⚔️ Armi Incantate',
      test: /^Enspelled Weapon\b/i
    },
    { key: 'manual', label: '📖 Manuali', test: /^Manual of\b/i }
  ];

  const isStrutturaClasse = it =>
    (it.tip || '').startsWith('Struttura Classe —');

  const isPozione = it =>
    /pozion|potion/i.test(it.n || '');

 
  // Determina a quale famiglia appartiene una ricetta.
  const famigliaDi = it => {
    // Nuovi oggetti decorativi: raggruppamento dedicato per mestiere.
    if (it.tip === 'Decorazioni Alchemiche' && m.id === 'alchimista') {
      return { key: 'decorazioni-alchimista', label: '⚗️ Espositori e Vetreria Alchemica' };
    }
    if (it.tip === 'Decorazioni Meccaniche' && m.id === 'meccanico') {
      return { key: 'decorazioni-meccanico', label: '⚙️ Orologi e Congegni Decorativi' };
    }
    if (it.tip === 'Decorazioni da Locanda' && m.id === 'oste') {
      return { key: 'decorazioni-oste', label: '🍻 Arredi e Servizio da Locanda' };
    }
    if (it.tip === 'Decorazioni Artigianali' && m.id === 'artigiano') {
      return { key: 'decorazioni-artigiano', label: '🛠️ Oggetti Artigianali Decorativi' };
    }
    if (it.tip === 'Decorazioni in Metallo' && m.id === 'metallurgo') {
      return { key: 'decorazioni-metallurgo', label: '🕯️ Arredi e Decorazioni in Metallo' };
    }

    if (raggruppaStrutture && isStrutturaClasse(it)) {
      return {
        key: 'strutture-classe',
        label: '🏛️ Strutture di Classe'
      };
    }

    if (raggruppaPozioni && isPozione(it)) {
      return {
        key: 'pozioni',
        label: '🧪 Pozioni'
      };
    }

    if (raggruppaOste) {
      const nome = it.n || '';

      const bevande =
        /\b(sidro|grog|birra|vino|sake|t[eè]|whiskey|liquore|nettare|caff[eè]|idromele|distillato|bibita|elisir|pyrax)\b/i;

      if (bevande.test(nome)) {
        return {
          key: 'bevande-oste',
          label: '🍺 Bibite e Alcolici'
        };
      }

      return {
        key: 'cibo-oste',
        label: '🍖 Cibo'
      };
    }

   if (raggruppaSarto) {
  const nome = it.n || '';

  // Decorazioni e tessili per arredare gli ambienti.
  if (/cuscino|tenda|coperta|tovaglia|tappeto|arazzo/i.test(nome) || /decorazioni e tessili/i.test(it.tip || '')) {
    return {
      key: 'decorazioni-sarto',
      label: '🧵 Decorazioni e Tessili'
    };
  }

  // Armature e difese, inclusi i bracciali difensivi.
  if (
    /armatura|armor|bracers of defense/i.test(nome)
  ) {
    return {
      key: 'armature-sarto',
      label: '🛡️ Armature e Difese'
    };
  }

  // Abiti, vesti, mantelli e tessuti indossabili.
  if (
    /abito|abiti|vesti|vestit|vestaglia|tunica|robe|cloak|mantle|mantello|glamerweave|shiftweave|clothes|camuffamento|mimetismo|costume/i.test(nome)
  ) {
    return {
      key: 'abiti-sarto',
      label: '👘 Abiti, Vesti e Mantelli'
    };
  }

  // Accessori indossabili.
  if (
    /boots|bracers|gloves|hat|belt|wraps|cap of|nature's mantle/i.test(nome)
  ) {
    return {
      key: 'indossabili-sarto',
      label: '👢 Accessori e Oggetti Indossabili'
    };
  }

  // Equipaggiamento pratico da avventura.
  if (
    /bag|borsa|quiver|faretra|pouch|rope|corda|saddle|balloon pack|fionda|frusta|talking doll/i.test(nome)
  ) {
    return {
      key: 'avventura-sarto',
      label: '🎒 Equipaggiamento e Accessori da Avventura'
    };
  }

  // Creazioni uniche o eccezionali.
  if (/tessuto del fato/i.test(nome)) {
    return {
      key: 'creazioni-speciali-sarto',
      label: '✨ Tessuti Incantati e Creazioni Speciali'
    };
  }
}
    
    if (raggruppaArtista) {
      const nome = it.n || '';
      const testo = `${nome} ${it.tip || ''}`;

      // Oggetti decorativi e opere visive non magiche.
      if (/decorazioni e arti visive/i.test(it.tip || '') || /quadro decorativo|ritratto|cornice decorata|insegna dipinta|statuetta decorativa/i.test(nome)) {
        return {
          key: 'decorazioni-artista',
          label: '🎨 Decorazioni e Arti Visive'
        };
      }

      // Pergamene magiche di qualsiasi livello.
      if (/pergamena|scroll/i.test(testo)) {
        return {
          key: 'pergamene-artista',
          label: '📜 Pergamene Magiche'
        };
      }

      // Tatuaggi magici.
      if (/tattoo|tatuaggio/i.test(testo)) {
        return {
          key: 'tatuaggi-artista',
          label: '✒️ Tatuaggi Magici'
        };
      }

      // Libri degli incantesimi e grimori.
      if (/spellbook|libro degli incantesimi|arcane grimoire|grimoire/i.test(testo)) {
        return {
          key: 'grimori-artista',
          label: '📚 Libri e Grimori Arcani'
        };
      }

      // Opere d'arte e creazioni artistiche uniche.
      if (/mural|obra maestra|ritratto|manifesto della creazione|opera d'arte|opera d’arte/i.test(testo)) {
        return {
          key: 'opere-artista',
          label: "🖼️ Opere d'Arte e Creazioni Speciali"
        };
      }

      // Reliquie e oggetti artistici speciali.
      if (/icon of ravenloft|reliquia|oggetto artistico speciale/i.test(testo)) {
        return {
          key: 'reliquie-artista',
          label: '✨ Reliquie e Oggetti Artistici Speciali'
        };
      }
    }

    if (raggruppaMetallurgo) {
      const nome = it.n || '';
      const testo = `${nome} ${it.tip || ''}`;

      // Armature, scudi, elmi e protezioni.
      if (/armatura|armor|scudo|shield|plate|mail|breastplate|helm|elmo|dastana|armatura a scaglie|cotta di maglia|maglia a catena/i.test(testo)) {
        return {
          key: 'armature-metallurgo',
          label: '🛡️ Armature, Scudi e Protezioni'
        };
      }

      // Potenziamenti e versioni migliorate di armi o armature.
      if (/miglioramento armi|arma del mestiere|\+\s*[123]/i.test(nome)) {
        return {
          key: 'potenziamenti-metallurgo',
          label: '⚒️ Potenziamenti e Miglioramenti'
        };
      }

      // Armi comuni e relative varianti non magiche.
      if (/^(pugnale|mazza|accetta|spada corta|stocco|scimitarra|spada lunga|spadone|ascia bipenne|martello da guerra|alabarda|falcione|pistola|moschetto|katana|naginata|chakram|shuriken|dardo|lancia|falcetto|martello leggero|picca da guerra|tridente|picca|stella del mattino|maglio|lancia da cavaliere|mazzafrusto|ascia da battaglia|scimitarra a doppia lama)\b/i.test(nome)) {
        return {
          key: 'armi-comuni-metallurgo',
          label: '⚔️ Armi'
        };
      }

      // Armi magiche nominate e armi incantate.
      if (/sword of|vorpal sword|nine lives stealer|holy avenger|moon-touched sword|sylvan talon|enspelled weapon|lancia di noxus/i.test(nome)) {
        return {
          key: 'armi-magiche-metallurgo',
          label: '✨ Armi Magiche e Speciali'
        };
      }

      // Oggetti speciali, strumenti e manufatti non classificati sopra.
      if (/cannoniere noxiano|figurine of wondrous power|mechanical wonder|prosthetic limb|veteran's cane|ear horn|lock of trickery|masque charm|mystery key|rival coin|shield of expression/i.test(nome)) {
        return {
          key: 'oggetti-speciali-metallurgo',
          label: '🔧 Oggetti Speciali e Manufatti'
        };
      }
    }

    if (raggruppaMeccanico) {
      const nome = it.n || '';
      const testo = `${nome} ${it.tip || ''}`;

      // Protesi ed esoscheletri: modifiche applicate al corpo o all'armatura.
      if (/protesi|esoscheletro/i.test(testo)) {
        return {
          key: 'protesi-meccanico',
          label: '🦾 Protesi ed Esoscheletri'

      // Automi e nuclei per costrutti.
      if (/automa|nucleo automa/i.test(testo)) {
        return {
          key: 'automi-meccanico',
          label: '🤖 Automi e Costrutti'
        };

      // Armi, modifiche offensive, armature e scudi.
      if (/balestra|modifica arma|armatura rinforzata|scudo a deflettore/i.test(nome)) {
        return {
          key: 'armi-difese-meccanico',

      // Orologi e dispositivi che misurano o alterano il tempo.
      if (/orologio|clockwork amulet|macchina del tempo/i.test(nome)) {
        return {
          key: 'orologi-meccanico',
          label: '⏱️ Orologi e Dispositivi Temporali'
        };
      }

      // Trappole, sistemi di sicurezza e congegni pericolosi.
      if (/trappola|meccanismo di difesa|congegno esplosivo|grimaldello/i.test(nome)) {
        return {
          key: 'trappole-meccanico',
          label: '🪤 Trappole e Meccanismi di Sicurezza'
        };
      }

      // Strumenti e attrezzature meccaniche da lavoro o avventura.
      if (/lanterna|carrucola|fischietto|molla a ricarica|gancio retrattile|manifold tool/i.test(nome)) {
        return {
          key: 'attrezzature-meccanico',
          label: '🔧 Strumenti e Attrezzature'
        };
      }
    }

    if (raggruppaFalegname) {
      const nome = it.n || '';
      const testo = `${nome} ${it.tip || ''}`;

      // Mobili e arredamento di base.
      if (/^sedia$|^tavolo$|^letto$/i.test(nome) || /mobili e arredamento/i.test(it.tip || '')) {
        return {
          key: 'mobili-falegname',

      // Armature e difese.
      if (/armatura|armor|shield|scudo/i.test(testo)) {

      // Munizioni.

      // Strumenti musicali.
      if (/strumento musicale|instrument of|liuto|lute|arpa|harp|tamburo|drum|bandore|cittern|pipes of|lyre|flauto/i.test(testo)) {
        return {
          key: 'strumenti-falegname',
          label: '🎻 Strumenti Musicali'
        };
      }

      // Bacchette, staffe e oggetti magici.
      if (/wand of|bacchetta|staff of|staffa|enspelled staff|rod of|pole of|broom of|scopa/i.test(testo)) {
        return {
          key: 'bacchette-falegname',
          label: '🪄 Bacchette, Staffe e Oggetti Magici'
        };
      }

      // Armi.
      if (/arco|balestra|bastone ferrato|clava|giavellotto|cerbottana|\bbow\b|\bcrossbow\b|weapon/i.test(testo)) {
        return {
          key: 'armi-falegname',
          label: '🏹 Armi'
        };
      }

      // Attrezzature ed equipaggiamento.
      if (/barile|cassa|equipaggiamento|attrezzatura|angling|collapsing/i.test(testo)) {
        return {
          key: 'attrezzature-falegname',
          label: '🪚 Attrezzature ed Equipaggiamento'
        };
      }
    }

    if (m.id === 'artigiano' && !searchQ && !filtriAttivi) {
      return famiglieArtigiano.find(f => f.test.test(it.n || '')) || null;
    }

    return null;
  };


  // Raggruppa soltanto le famiglie con almeno due ricette.
  const gruppi = new Map();

  for (const it of items) {
    const famiglia = famigliaDi(it);

  const confrontaNomi = (a, b) =>

function applyRecipeFilters(event, reset = false) {
  event?.preventDefault();
  const form = document.querySelector('.recipe-filter-form');
  if (!form) return;
  const field = name => form.querySelector(`[name="${name}"]`);
  recipeFilterState = {
    scope: form.dataset.scope || '',
    tipologia: reset ? '' : (field('tipologia')?.value || ''),
    costoMax: reset ? '' : (field('costoMax')?.value || ''),
    downtimeMax: reset ? '' : (field('downtimeMax')?.value || ''),
    open: true
  };
  renderContent();
  document.getElementById('recipeFilterStatus')?.focus({ preventScroll: true });
}

function resetRecipeFilters() {
  applyRecipeFilters(null, true);
}

function toggleRecipeFilters(button) {
  const isOpen = button?.getAttribute('aria-expanded') !== 'true';
  recipeFilterState.open = isOpen;
  const panel = document.getElementById(button?.getAttribute('aria-controls'));
  if (!panel || !button) return;
  panel.hidden = !isOpen;
  button.setAttribute('aria-expanded', String(isOpen));
}

function removeRecipeFilter(key) {
  if (!['tipologia', 'costoMax', 'downtimeMax'].includes(key)) return;
  recipeFilterState[key] = '';
  recipeFilterState.open = true;
  renderContent();
  document.querySelector('.recipe-filter-toggle')?.focus({ preventScroll: true });
}

// Apre o chiude il gruppo di ricette.
function toggleClassStructures(button) {
  const groupRow = button.closest('tr');
  if (!groupRow) return;

  const expanded = button.getAttribute('aria-expanded') === 'true';
  let row = groupRow.nextElementSibling;

  while (row && row.hasAttribute('data-class-structure-row')) {
    row.hidden = expanded;
    row = row.nextElementSibling;
  }

  button.setAttribute('aria-expanded', String(!expanded));

  const chevron = button.querySelector('.class-structures-chevron');
  if (chevron) {
    chevron.textContent = expanded ? '▸' : '▾';
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function highlightSearchText(value) {
  const text = String(value || '');
  if (!searchQ) return escapeHTML(text);
  const lowerText = text.toLocaleLowerCase('it');
  const lowerQuery = searchQ.toLocaleLowerCase('it');
  const start = lowerText.indexOf(lowerQuery);
  if (start < 0) return escapeHTML(text);
  const end = start + searchQ.length;
  return `${escapeHTML(text.slice(0, start))}<mark>${escapeHTML(text.slice(start, end))}</mark>${escapeHTML(text.slice(end))}`;
}

// Accetta solo collegamenti HTTPS al dominio di riferimento previsto dal catalogo.
function safeExternalUrl(value) {
  const url = String(value || '');
  // Host esatto: rifiuta schemi diversi, sottodomini, porte e userinfo.
  return /^https:\/\/5e\.tools(?:[/?#]|$)/i.test(url) ? url : null;
}

function renderSearch(m) {
  let html = `<div style="margin-bottom:16px;color:var(--text2)">Risultati per <strong style="color:var(--gold)">"${escapeHTML(searchQ)}"</strong> in ${escapeHTML(m.nome)}:</div>`;
  let found = false;
  m.livelli.forEach(lv => {
    const items = lv.items.filter(it => matches(it, searchQ));
    if (items.length) {
      found = true;
      html += renderLv(m, {...lv, items});
    }
  });
  if (!found) html += '<div class="no-results">Nessun risultato trovato in questo mestiere.</div>';
  return html;
}

function renderGlobalSearch() {
  let html = `<div style="margin-bottom:16px;color:var(--text2)">Risultati per <strong style="color:var(--gold)">"${escapeHTML(searchQ)}"</strong> in tutti i mestieri:</div>`;

  MESTIERI.forEach(m => {

}



function scrollToHomeProfessions() {
  // Il kicker è il punto d'arrivo e resta subito sotto la navigazione fissa.
  const target = document.querySelector('#homeProfessions .home-kicker');
  if (!target) return;

  const header = document.querySelector('header');
  const tabs = document.getElementById('tabs');
  const headerBottom = header?.getBoundingClientRect().bottom || 0;
  const tabsRect = tabs?.getBoundingClientRect();
  const tabsStyle = tabs ? window.getComputedStyle(tabs) : null;

  // Calcola il bordo che le tabs avranno dopo essersi fissate sotto l'header;
  // il loro bordo corrente è più in basso perché la pagina non è ancora scorsa.
  const tabsTop = Number.parseFloat(tabsStyle?.top || '0') || 0;
  const tabsStickyBottom = tabs && tabsStyle?.position === 'sticky'
    ? tabsTop + (tabsRect?.height || 0)
    : 0;
  const stickyBottom = Math.max(headerBottom, tabsStickyBottom);
  const targetTop = window.scrollY + target.getBoundingClientRect().top;
  const top = targetTop - stickyBottom + 24;

  window.scrollTo({ top: Math.max(0, top), behavior: 'instant' });
  // Dopo lo scroll le tabs possono diventare sticky: corregge l'offset usando
  // la posizione effettiva della barra, così il titolo resta sempre visibile.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const headingTop = target.getBoundingClientRect().top;
    const settledHeaderBottom = header?.getBoundingClientRect().bottom || 0;
    const settledTabs = tabs?.getBoundingClientRect();
    const settledTabsStyle = tabs ? window.getComputedStyle(tabs) : null;
    const settledObstruction = settledTabs && settledTabsStyle?.position === 'sticky'
      ? Math.max(settledHeaderBottom, settledTabs.bottom)
      : settledHeaderBottom;
    const correction = headingTop - settledObstruction - 24;
    if (Math.abs(correction) > 1) window.scrollBy({ top: correction, behavior: 'instant' });
  }));
}

function renderSearchSuggestions(query) {
  const input = document.getElementById('searchInput');
  const clearButton = document.querySelector('.search-clear');
  const list = document.getElementById('searchSuggestions');
  if (!input || !list) return;
  const term = String(query || '').trim().toLocaleLowerCase('it');
  if (clearButton) clearButton.hidden = !term;
  if (term.length < 2) {
    list.hidden = true;
    list.innerHTML = '';
    activeSearchSuggestionIndex = -1;
    input.removeAttribute('aria-activedescendant');
    input.setAttribute('aria-expanded', 'false');
    return;
  }
  if (!searchSuggestionCache) {
    searchSuggestionCache = [...new Set(MESTIERI.flatMap(m => m.livelli.flatMap(lv => lv.items.flatMap(item => [
      item.n,
      item.tip,
      item.mp?.replace(/^[\d.,]+\s*MO\s*/i, ''),
      item.ms?.replace(/^[\d.,]+\s*MO\s*/i, '')
    ].filter(Boolean)))))];
  }
  const suggestions = searchSuggestionCache
    .filter(name => name.toLocaleLowerCase('it').includes(term))
    .sort((a, b) => {
      const aStarts = a.toLocaleLowerCase('it').startsWith(term);
      const bStarts = b.toLocaleLowerCase('it').startsWith(term);
      return Number(bStarts) - Number(aStarts) || a.localeCompare(b, 'it', { sensitivity: 'base' });
    })
    .slice(0, 7);
  activeSearchSuggestionIndex = -1;
  input.removeAttribute('aria-activedescendant');
  list.innerHTML = suggestions.map((name, index) => `<button type="button" id="searchSuggestion-${index}" class="search-suggestion" role="option" aria-selected="false" tabindex="-1" data-query="${escapeHTML(name)}" onclick="selectSearchSuggestion(this.dataset.query)">${highlightSearchText(name)}</button>`).join('');
  list.hidden = suggestions.length === 0;
  input.setAttribute('aria-expanded', String(suggestions.length > 0));
}

function selectSearchSuggestion(value) {
  const input = document.getElementById('searchInput');
  const query = String(value || '');
  if (input) input.value = query;
  doSearch(query);
  closeSearchSuggestions();
  input?.focus({ preventScroll: true });
}

function closeSearchSuggestions() {
  const input = document.getElementById('searchInput');
  const list = document.getElementById('searchSuggestions');
  if (list) list.hidden = true;
  activeSearchSuggestionIndex = -1;
  input?.removeAttribute('aria-activedescendant');
  input?.setAttribute('aria-expanded', 'false');
}

function setActiveSearchSuggestion(index) {
  const input = document.getElementById('searchInput');
  const options = [...document.querySelectorAll('#searchSuggestions .search-suggestion')];
  if (!input || !options.length) return;
  activeSearchSuggestionIndex = (index + options.length) % options.length;
  options.forEach((option, optionIndex) => {
    option.setAttribute('aria-selected', String(optionIndex === activeSearchSuggestionIndex));
  });
  input.setAttribute('aria-activedescendant', options[activeSearchSuggestionIndex].id);
  options[activeSearchSuggestionIndex].scrollIntoView({ block: 'nearest' });
}

function handleSearchKeydown(event) {
  const input = document.getElementById('searchInput');
  const list = document.getElementById('searchSuggestions');
  const options = list && !list.hidden ? list.querySelectorAll('.search-suggestion') : [];
  if (event.key === 'Escape' && list && !list.hidden) {
    event.preventDefault();
    closeSearchSuggestions();
    return;
  }
  if (!options.length) return;
  if (event.key === 'ArrowDown') {
    event.preventDefault();
    setActiveSearchSuggestion(activeSearchSuggestionIndex + 1);
  } else if (event.key === 'ArrowUp') {
    event.preventDefault();
    setActiveSearchSuggestion(activeSearchSuggestionIndex < 0 ? options.length - 1 : activeSearchSuggestionIndex - 1);
  } else if (event.key === 'Home') {
    event.preventDefault();
    setActiveSearchSuggestion(0);
  } else if (event.key === 'End') {
    event.preventDefault();
    setActiveSearchSuggestion(options.length - 1);
  } else if (event.key === 'Enter' && activeSearchSuggestionIndex >= 0) {
    event.preventDefault();
    const selected = options[activeSearchSuggestionIndex];
    if (selected) selectSearchSuggestion(selected.dataset.query);
  }
}

function clearCatalogSearch() {
  const input = document.getElementById('searchInput');
  if (input) input.value = '';
  doSearch('');
  input?.focus({ preventScroll: true });
}

function render() {
  document.querySelector('.main').classList.toggle('home-mode', currentMestiere === -2 && !searchQ);
  renderTabs();
  renderSideNav();
  renderContent();
  syncMobileDrawer();
  renderSearchSuggestions(searchQ);
}

// Mostra mobile FAB solo quando c'è sidenav da mostrare
function updateMobileFab() {
  const btn = document.getElementById('mobileNavBtn');
  if (btn) btn.style.display = currentMestiere >= 0 ? 'flex' : 'none';
}

render();
updateThemeBtn();

</script>
