name: Regression tests

# The regression suite is included in the full workflow in playwright.yml.
# Keep this file as a clear entry point for local-only quick checks.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:regression
